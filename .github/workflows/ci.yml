name: CI

on:
  push:
    branches:
      - main
      - "phase2a/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify source
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: postgresql://ci_validation:validation@127.0.0.1:5432/validation?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run isolated pure regression tests
        run: npm run test:pure

      - name: Verify SEO audit parser
        run: npm run verify:seo-audit-core

      - name: Verify SEO storefront retry
        run: npm run verify:seo-audit-storefront-fetch

      - name: Verify sitemap audit
        run: npm run verify:sitemap-audit

      - name: Verify redirect audit
        run: npm run verify:redirect-audit

      - name: Verify LLM visibility
        run: npm run verify:llm-visibility

      - name: Verify schema storefront extension
        run: npm run verify:schema-storefront-extension

      - name: Verify storefront settings
        run: npm run verify:storefront-settings

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build application
        run: npm run build

      - name: Build initial scan worker
        run: npm run build:scan-worker

      - name: Build repair worker
        run: npm run build:repair-worker

      - name: Build queue reconcile worker
        run: npm run build:queue-reconcile-worker

      - name: Build IndexNow worker
        run: npm run build:indexnow-worker

      - name: Build provider materializer
        run: npm run build:provider-materialization-worker

      - name: Build multishop provider materializer
        run: npm run build:provider-materialization-multishop-worker

      - name: Build multishop IndexNow worker
        run: npm run build:indexnow-multishop-worker

      - name: Build SEO audit worker
        run: npm run build:seo-audit-worker

      - name: Build product webhook worker
        run: npm run build:product-webhook-worker

  product-webhook-postgres:
    name: PostgreSQL webhook integration
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.10
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: webhook_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d webhook_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/webhook_ci?schema=public
      PRODUCT_WEBHOOK_POSTGRES_INTEGRATION: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx --no-install prisma generate
      - name: Run PostgreSQL webhook integration
        run: npm run test:product-webhook:postgres
